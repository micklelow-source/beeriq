# Render Blueprint — production equivalent of docker-compose.yml.
# Import at https://dashboard.render.com/blueprints, pointing at this repo.
#
# After the first deploy, confirm the actual public URLs Render assigned to
# each service (dashboard shows them under each service's name). If they
# differ from the *.onrender.com names assumed below, update:
#   - brewiq-frontend's NEXT_PUBLIC_API_BASE_URL (then trigger a redeploy —
#     it's baked into the JS bundle at build time)
#   - brewiq-api's BREWIQ_CORS_ALLOW_ORIGINS (takes effect on next restart)
#
# Database: moved off Render's own managed Postgres (the free-tier "brewiq-db"
# instance expired/became unreachable) onto Neon as of 2026-08-11. Both
# brewiq-api and brewiq-weekly-tap-refresh's BREWIQ_DATABASE_URL are set to
# "sync: false" below -- set the Neon connection string manually in each
# service's Render dashboard env vars rather than committing it here. If the
# old brewiq-db resource is still visible in the Render dashboard, it can be
# deleted once you've confirmed nothing else still points at it.

services:
  - type: web
    name: brewiq-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: BREWIQ_ENV
        value: production
      - key: BREWIQ_LOG_JSON
        value: "true"
      - key: BREWIQ_AI_PROVIDER
        value: heuristic
      - key: BREWIQ_DATABASE_URL
        sync: false # set manually in the Render dashboard — Neon connection string, not committed here
      - key: BREWIQ_CORS_ALLOW_ORIGINS
        value: https://brewiq-frontend.onrender.com
      - key: BREWIQ_HTTP_USER_AGENT
        value: "BrewIQBot/0.1 (+https://github.com/micklelow-source/beeriq)"

  - type: web
    name: brewiq-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://brewiq-api.onrender.com

# The weekly automated re-scrape of the 6 New England states used to run here
# as a Render Cron Job, but that requires a paid ("starter") plan. Moved to
# .github/workflows/weekly-tap-refresh.yml, which runs the same command on
# GitHub's free scheduled-workflow runners against the same (Neon) database —
# set the BREWIQ_DATABASE_URL repo secret there for it to work.
