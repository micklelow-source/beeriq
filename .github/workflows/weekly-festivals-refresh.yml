name: Weekly festivals refresh

# Re-applies the curated beer-festival/tasting seed (app.seeds.festivals) to
# production. Unlike the tap/events/food-truck refreshes, this is NOT a live
# re-scrape: beerfests.com sits behind a Cloudflare bot-challenge that blocks
# a plain HTTP client (confirmed 403 "Just a moment..." even with a
# browser-like User-Agent), and automating past that challenge is out of
# bounds. The underlying data is hand-curated from beerfests.com by a human
# session periodically (see backend/app/seeds/festivals.py's module
# docstring for the last snapshot date/coverage) and committed to the repo;
# this job's only purpose is to sync whatever's currently committed into
# production every week, so a future data-curation commit takes effect
# without a manual deploy step. Runs on its own day (Sunday), independent of
# the tap-list (Monday), events (Wednesday), and food-truck (Friday)
# refreshes.
#
# Requires the same BREWIQ_DATABASE_URL repo secret as the other workflows
# (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "0 6 * * 0" # every Sunday, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: weekly-festivals-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync curated festivals/tastings
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      BREWIQ_ENV: production
      BREWIQ_LOG_JSON: "true"
      BREWIQ_AI_PROVIDER: heuristic
      BREWIQ_DATABASE_URL: ${{ secrets.BREWIQ_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Sync festivals
        run: python -m app.seeds.festivals
